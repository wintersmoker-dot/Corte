name: Construir APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.webmanifest', 'icon-*.png', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Crear proyecto Android con Capacitor
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          mkdir www
          cp ../index.html ../manifest.webmanifest ../icon-192.png ../icon-512.png www/
          npx cap init Corte com.corte.editor --web-dir www
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk Corte.apk
          gh release create "apk-${{ github.run_number }}" Corte.apk --title "Corte APK ${{ github.run_number }}" --notes "APK de prueba (firma de depuración). Instálalo permitiendo orígenes desconocidos."
